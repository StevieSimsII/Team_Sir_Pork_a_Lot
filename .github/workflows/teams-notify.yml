name: Daily Teams Summary

on:
  schedule:
    - cron: "0 14 * * *"   # 9 AM Central (14:00 UTC)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  teams-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Post Teams summary
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_HOSTNAME: kingsofcode.sharepoint.com
          SHAREPOINT_SITE_PATH: /sites/StevieCopilot
          SHAREPOINT_LIST_ID: c42c872a-510e-47d1-818a-1f55e0a96f4e
          GOAL_AMOUNT: "30000"
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python dashboard/teams_notify.py
